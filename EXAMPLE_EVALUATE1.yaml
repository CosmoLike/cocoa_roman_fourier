theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 7.5
#  NOTE: under TATT with IA_code: 1 this project's precision needs
#  accuracyboost: 2 (the doubled output-table density). The fastpt
#  boosts are rebased so 1.0 is the converged two-grid
#  configuration: accuracyboost multiplies the density of the output
#  table cosmolike interpolates (the accuracy driver) and
#  internal_accuracyboost the FFTLog grid (see tests/README.md,
#  test 15).
#  fastpt:
#    path: ./external_modules/code/FAST-PT
#    extra_args:
#      accuracyboost: 2.0
#      internal_accuracyboost: 1.0
#      kmax_boltzmann: 7.5
#      extrap_kmax: 250.0
  # bfmt:
  #   baryon_model: 2 # 1 = SP(k), 2 = BCEmu, 3 = FlamingoEmulator, 4 = BACCOemu, 5 = BCemu2025
  #   nz: 20  # internal (z, k) computation grid; the result is 2D-splined
  #   nk: 100 # onto the grid the likelihood requests
  #   above_zmax: unity # S(k,z) above the model range: unity (default) or constant
  #   q2_bcemu25: 0.70 # BCemu2025 only: q2 coordinate (native grid: 0.5, 0.7, 1.0)

