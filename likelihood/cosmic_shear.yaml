path: null
data_file: roman_fourier_M1_GGL0.05.dataset
# chi2 responds non-monotonically to this knob on the frozen example2
# 3x2pt test point (delta = +0.16, +0.03, -0.17, -0.12, -0.10 at boost
# 1.25, 1.5, 2, 3, 5), so a raised value adds jitter, not convergence.
accuracyboost: 1.0
integration_accuracy: 0
kmax_boltzmann: 7.5
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# exclude ggl nl-ns bin pairs (need to set the dv size even w/ CS only)
ggl_exclude: [[4,0],[5,0],[6,0],[6,1],[6,2],[7,0],[7,1],[7,2],[7,3]]




add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/roman_fourier/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/roman_fourier/chains/roman_fourier_theory.modelvector"

params: !defaults [params_source]
