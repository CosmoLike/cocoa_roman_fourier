path: null
data_file: roman_fourier_M1_GGL0.05.dataset
# Two grids of this project need more than accuracyboost 1 (2026-10-01):
# - the z nodes of the power-spectrum tables (cosmolike interpolates
#   P(k, z) linearly in z between them) need 4 times the nodes of
#   accuracyboost 1: the 3x2pt chi2 moves by 0.25, 0.030, 0.002 from 1 to
#   2, 4, 8 times the nodes. accuracyboost 2 doubles them and
#   pk_z_refinement 2 doubles them again;
# - the C-FAST-PT tables of the TATT and one-loop bias terms need
#   accuracyboost 2: at 1 the cfastpt vs FAST-PT check of the tests
#   reaches delta chi2 0.25 (cosmic shear) and 0.31 (3x2pt), above the 0.2
#   band; at 2 it is 0.11 and 0.14.
# Do not lower either to save time (README: "Minimum accuracy parameters").
accuracyboost: 2.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
# refinements on top of accuracyboost (which multiplies them too):
# the non-Limber FFTLog chi grid, and the z nodes of the P(k) tables
nonlimber_accuracyboost: 1.0
pk_z_refinement: 2
integration_accuracy: 0
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
# galaxy-galaxy lensing: 0 = non-Limber below l = 150, 1 = Limber at every multipole
adopt_limber_gs: 0
# galaxy clustering: 0 = non-Limber below l = 150, 1 = Limber at every multipole
adopt_limber_gg: 0
# galaxy probes: 0 = perturbative galaxy bias, 1 = halo-model (HOD) galaxy
# power (Limber only: needs adopt_limber_gg = adopt_limber_gs = 1)
include_HOD_GX: 0
# shear and ggl IA: 0 = the IA_model above, 1 = halo-model IA
# (Fortuna et al. 2021; NLA only, Limber gs, include_HOD_GX = 0)
include_halo_IA: 0
kmax_boltzmann: 7.5
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# exclude ggl nl-ns bin pairs (need to set the dv size)
ggl_exclude: [[4,0],[5,0],[6,0],[6,1],[6,2],[7,0],[7,1],[7,2],[7,3]]

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag,bK] (see bias.c)
bias_model: [0,0,0,1,0,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/roman_fourier/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/roman_fourier/chains/roman_fourier_theory.modelvector"

params: !defaults [params_lens, params_source]
