path: null
data_file: roman_fourier_M1_GGL0.05.dataset
# accuracyboost refines the redshift grid of the power-spectrum tables
# dyadically (nested nodes; see likelihood/_cosmolike_prototype_base.py), so
# raising it is a true refinement. The default is 2.0 because the unrefined
# boost-1 grid carried about 0.28 of chi2 z-resolution error on the
# synthetic test point; the nested boost-2 grid removes it, and the refined
# grids agree to 0.05 through boost 5.
accuracyboost: 2.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
integration_accuracy: 0
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
kmax_boltzmann: 7.5
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# exclude ggl nl-ns bin pairs (need to set the dv size)
ggl_exclude: [[4,0],[5,0],[6,0],[6,1],[6,2],[7,0],[7,1],[7,2],[7,3]]

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag,bK] (see bias.c)
bias_model: [0,0,0,1,0,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/roman_fourier/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/roman_fourier/chains/roman_fourier_theory.modelvector"

params: !defaults [params_lens, params_source]
