### Emulator training
### Motivation:
###     Train Neural Network emulator to evaluate Roman 3x2pt
###     - fiducial data vector: dark matter only
###     - scale cut: default mask
### -----------------------------------------------------------------
### cosmology: baseline (omegam, As, ns, omegab, H0, mnu)
### survey footprint: medium tier
### systematics: 
###     - photo-z uncertainty: Gaussian mean shift
###     - intrinsic alignment: NLA
###     - galaxy bias: linear
###     - shear calibration bias: multiplicative

timing: True
debug: False
stop_at_error: False

likelihood:
  roman_fourier.roman_fourier_3x2pt:
    path: ./external_modules/data/roman_fourier
    data_file: roman_fourier_challenge1_medium.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 20.0
    non_linear_emul: 2
    IA_model: 0
    IA_redshift_evolution: 3
    ggl_exclude: [[7,0], [7,1]]
    
    
params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.00065
    proposal: 0.4
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.00001
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 0.00005
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.04
      scale: 0.000004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.3
      scale: 0.00002
    proposal: 0.02
    latex: \Omega_\mathrm{m}
    drop: true
  mnu:
    prior:
      min: 0.0558
      max: 0.6
    ref:
      dist: norm
      loc: 0.06
      scale: 0.001
    proposal: 0.01  
    latex: \m_\\nu
  w:
    value: -1
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 0.0
    latex: w_{a,\mathrm{DE}}
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ------------------------------------------------------------------
  # ------------- Derived Parameters ---------------------------------
  # ------------------------------------------------------------------
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  yheused:
    latex: Y_P^\mathrm{BBN}
  omegan2:
    latex: \Omega_\mathrm{\\nu} h^2
  omegan:
    derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
    latex: \Omega_\mathrm{\\nu}
  # ------------------------------------------------------------------
  # roman 3x2 nuissance parameter begins
  # ------------------------------------------------------------------

  # intrinsic alignment: NLA
  # ========================
  # same as default, roman_A1_1 [-5, 5]; roman_A1_2 [-5, 5]
  # fiducial value: 0.6, -1.5
  roman_A1_1:
    prior:
     min: -5
     max:  5
    ref:
     dist: norm
     loc: -0.7
     scale: 0.5
    proposal: 0.5
    latex: A_\mathrm{1-IA,roman}^1
  roman_A1_2:
    prior:
     min: -5
     max:  5
    ref:
     dist: norm
     loc: -1.7
     scale: 0.5
    proposal: 0.5
    latex: A_\mathrm{1-IA,roman}^2
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # photo-z uncertainty: gaussian
  # =============================
  # Lens galaxies photo-z shift
  roman_DZ_L1:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^1
  roman_DZ_L2:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^2
  roman_DZ_L3:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^3
  roman_DZ_L4:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^4
  roman_DZ_L5:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^5
  roman_DZ_L6:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^6
  roman_DZ_L7:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^7
  roman_DZ_L8:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.005
    ref:
      dist: norm
      loc: 0.0
      scale: 0.005
    proposal: 0.005
    latex: \Delta z_\mathrm{l,roman}^8
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Source galaxies photo-z errors
  roman_DZ_S1:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^1
  roman_DZ_S2:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^2
  roman_DZ_S3:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^3
  roman_DZ_S4:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^4
  roman_DZ_S5:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^5
  roman_DZ_S6:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^6
  roman_DZ_S7:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^7
  roman_DZ_S8:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.002
    ref:
      dist: norm
      loc: 0.0
      scale: 0.002
    proposal: 0.002
    latex: \Delta z_\mathrm{s,roman}^8
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Higher-order IA
  roman_A2_1: #TATT, not used for Y1
    value: 0.0
    latex: A_\mathrm{2-IA,roman}^1 
  roman_A2_2: #TATT, not used for Y1
    value: 0.0
    latex: A_\mathrm{2-IA,roman}^2
  roman_BTA_1: #TATT, not used for Y1
    value: 0.0
    latex: A_\mathrm{BTA-IA,roman}^1
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Linear galaxy bias
  roman_B1_1:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.24
      scale: 0.15
    proposal: 0.1
    latex: b_\mathrm{1-roman}^1
  roman_B1_2:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.36
      scale: 0.15
    proposal: 0.1
    latex: b_\mathrm{1-roman}^2
  roman_B1_3:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.47
      scale: 0.15
    proposal: 0.1
    latex: b_\mathrm{1-roman}^3
  roman_B1_4:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.60
      scale: 0.15
    proposal: 0.1
    latex: b_\mathrm{1-roman}^4
  roman_B1_5:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.76
      scale: 0.1
    proposal: 0.1
    latex: b_\mathrm{1-roman}^5
  roman_B1_6:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.76
      scale: 0.1
    proposal: 0.1
    latex: b_\mathrm{1-roman}^6
  roman_B1_7:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.76
      scale: 0.1
    proposal: 0.1
    latex: b_\mathrm{1-roman}^7
  roman_B1_8:
    prior:
      min: 0.8
      max: 4
    ref:
      dist: norm
      loc: 1.76
      scale: 0.1
    proposal: 0.1
    latex: b_\mathrm{1-roman}^8
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # shear calibration bias: multiplicative
  roman_M1:
    value: 0.0
    latex: m_\mathrm{roman}^1
  roman_M2:
    value: 0.0
    latex: m_\mathrm{roman}^2
  roman_M3:
    value: 0.0
    latex: m_\mathrm{roman}^3
  roman_M4:
    value: 0.0
    latex: m_\mathrm{roman}^4
  roman_M5:
    value: 0.0
    latex: m_\mathrm{roman}^5
  roman_M6:
    value: 0.0
    latex: m_\mathrm{roman}^6
  roman_M7:
    value: 0.0
    latex: m_\mathrm{roman}^7
  roman_M8:
    value: 0.0
    latex: m_\mathrm{roman}^8
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # baryon effects: the first two PCs
  # Q1 informative: [0, 7]
  # Q1 wide: [-6, 20]
  # Q2: [-4, 4] 
  # =================================
  roman_BARYON_Q1:
    value: 0.0
    latex: Q_\mathrm{roman}^1
  roman_BARYON_Q2:
    value: 0.0
    latex: Q_\mathrm{roman}^2

  # ------------------------------------------------------------------
  # roman 3x2 nuissance parameter ends
  # ------------------------------------------------------------------
prior:
  bbn_consistency: "lambda omegab, H0: 1.45 if 0.005<=omegab*(H0/100)**2<=0.04 else -np.inf"

theory:
  camb:
    path: ./external_modules/code/CAMB
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.1
      lens_potential_accuracy: 1.1
      num_massive_neutrinos: 3
      nnu: 3.046
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 20

emulator:
  survey_name: "roman"
  io:
    savedir: /groups/timeifler/jiachuanxu/roman_fourier_emulator_output
    save_train_data: true
    save_intermediate_model: true
  init_sample:
    type: "gaussian" # "lhs" or "gaussian"
    # LHS section
    lhs_n: 18000 # Latin-Hyper Sample size
    # Gaussian section
    gauss_cov: ./projects/roman_fourier/fid_3x2_full.covmat
    gauss_temp_train: 128 # training dataset temperature
    n_train: 1000000
    #n_train: 10000
    gauss_shift_train: 
     # omegam: 0.0
     # sigma8: 0.0
    gauss_temp_valid: 64  # validation dataset temperature
    n_valid: 200000
    gauss_shift_valid:
  training:
    emu_type: nn
    nn_model: 6
    chi_sq_cut: 1.0e+5
    n_train_iter: 1
    batch_size: 256
    n_epochs: 200
    loss_type: "hyperbola"
    #loss_type: "clipped_mean"
    #loss_type: "mean"
    learning_rate: 1.0e-3
    weight_decay: 1.0e-3
    reduce_lr: True
  derived:
    sigma8_fid: 0.827706
    sigma8_std: 0.01
  sampling:
    ### MCMC settings for retrieving the training sample from tempered posterior
    n_mcmc: 1000000
    #n_mcmc: 10000
    n_emcee_walkers: 100
    n_burn_in: 500000
    #n_burn_in: 5000
    n_thin: 10
