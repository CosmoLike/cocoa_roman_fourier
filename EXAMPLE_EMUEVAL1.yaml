  # ------------------------------ COSMOLOGICAL PARAMETERS ---------------------
  # ----------------------------------------------------------------------------
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.06
    proposal: 0.06
    latex: 10^9 A_\mathrm{s})
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.9645
      scale: 0.006
    proposal: 0.006
    latex: n_\mathrm{s}
  H0:
