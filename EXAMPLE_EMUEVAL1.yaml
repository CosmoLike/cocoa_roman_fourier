#Example MCMC for cosmic shear data vector
timing: True
debug: False
stop_at_error: False

likelihood:
  roman_fourier.roman_fourier_3x2pt_emu:
    ### Here you can overwrite options in roman_fourier_${probe}.yaml
    path: ./external_modules/data/roman_fourier
    #data_file: roman_fourier_challenge1_medium.dataset
    data_file: roman_fourier_challenge1_medium_test.dataset
    train_config: ./projects/roman_fourier/emulator/train_emu_resmlp512_7_HF_NLA_minimal.yaml
    print_datavector: False
    print_datavector_file: "./projects/roman_fourier/data/roman_fourier_challenge1_medium_test.emuvector"

