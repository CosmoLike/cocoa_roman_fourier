      max: 0.9
    ref:
      dist: norm
      loc: 0.3156
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{m}
  mnu:
    value: 0.0
    latex: m_{\nu}
  w:
    value: -1.0
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 0.0
    latex: w_{a,\mathrm{DE}}
